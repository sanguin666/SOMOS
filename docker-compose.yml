services:
  postgres:
    image: postgres:16-alpine
    container_name: mypeople-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mypeople
      POSTGRES_PASSWORD: mypeople
      POSTGRES_DB: mypeople
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
